<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이지성의 자기소개</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.png">
</head>
<body>
<div class="wrap">
    <header>
            <h1>이지성의 자기소개</h1>
            <nav>
                <ul class="move-page">
                    <li class="move"><a href="index.html">처음</a></li>
                    <li class="move"><a href="about.html">자기소개</a></li>
                    <li class="move"><a href="couses.html">수강 과목</a></li>
                </ul>
            </nav>
    </header>
    <main>
        <div class="call">
                <a href="about.html#call">연락하러 가기</a>
        </div>
    <div class="all">
        <div class="my">
            <div>
                <h2>자기소개</h2>
            </div>
            <div class="ls">
                <section class="lh">
                    <h3>L/H</h3>
                    <ol>
                        <li class="l">L 
                            <ul>
                                <li>코딩</li>
                                <li>게임</li>
                            </ul>
                        </li>
                        <li class="h">H 
                            <ul>
                                <li>토마토</li>
                                <li>예의 없음</li>
                            </ul>
                        </li>
                    </ol>
                </section>
                <section class="tmi">
                    <h3>TMI</h3>
                    <ul class="mbti">
                        <li>MBTI : INTP</li>
                    </ul>
                </section>
            </div>
        </div>
            
        <aside  id="call">
            <h3>연락 하기</h3>
            <form action="https://httpbin.org/post" method="post" target="_blank" class="tel">
                <p class="name">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="홍길동" required>
                </p>
                <p>
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="name@email.com" required>
                </p>
                <p>
                    <label for="tel">전화번호</label>
                    <input type="tel" id="tel" name="tel" placeholder="010-0000-0000">
                </p>
                <p>
                    <label for="me">문의 종류</label>
                    <select id="me" name="me">
                        <option value="project">프로젝트 문의</option>
                        <option value="DB">데이터 베이스 관련</option>
                        <option value="ps">개인 사무용 연락</option>
                    </select>
                </p>
                <p>
                    <label for="memo">내용</label>
                    <textarea placeholder="내용을 입력하세요." id="memo" name="memo" rows="4"></textarea>
                </p>
                <p>
                    <button type="submit">보내기</button>
                </p>
            </form>
        </aside>
    </div>
    
    </main>
</div>
    <footer>
        <p>&copy; 
            <a href="https://www.naver.com/" target="_blank">이지성</a>
        </p>
    </footer>

    <script src="js/my-site-js.js"></script>
</body>
</html>
